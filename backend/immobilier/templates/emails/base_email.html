<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ImmoPlus{% endblock %}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        background-color: #f8fafc;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        color: #1e293b;
      }
      img {
        border: 0;
        outline: none;
        text-decoration: none;
        -ms-interpolation-mode: bicubic;
      }
      .wrapper {
        width: 100%;
        table-layout: fixed;
        background-color: #f8fafc;
        padding-top: 40px;
        padding-bottom: 40px;
      }
      .main-card {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .header {
        padding: 40px 48px 20px;
        text-align: left;
      }
      .logo {
        font-size: 24px;
        font-weight: 800;
        color: #0f172a;
        letter-spacing: -0.025em;
      }
      .logo span {
        color: #6366f1;
      }
      .content {
        padding: 0 48px 40px;
        font-size: 16px;
        line-height: 1.6;
        color: #334155;
      }
      .greeting {
        font-size: 20px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 16px;
      }
      .cta-button {
        display: inline-block;
        padding: 14px 28px;
        background-color: #6366f1;
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 15px;
        transition: background-color 0.2s;
      }
      .footer {
        max-width: 600px;
        margin: 0 auto;
        padding: 24px 48px;
        text-align: center;
        font-size: 13px;
        color: #64748b;
        line-height: 1.5;
      }
      .footer a {
        color: #6366f1;
        text-decoration: none;
      }
      .divider {
        height: 1px;
        background-color: #f1f5f9;
        margin: 32px 0;
      }
      @media only screen and (max-width: 600px) {
        .header,
        .content,
        .footer {
          padding-left: 24px !important;
          padding-right: 24px !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="main-card">
        <div class="header">
          <div class="logo">Immo<span>Plus</span></div>
        </div>
        <div class="content">
          {% block body %} {% block content %}{% endblock %} {% endblock %}
        </div>
      </div>
      <div class="footer">
        <p>
          &copy; 2026 ImmoPlus. Tous droits réservés.<br />
          Plateforme d'investissement et de gestion immobilière moderne.
        </p>
        <p>
          <a href="#">Se désabonner</a> &bull; <a href="#">Aide</a> &bull;
          <a href="#">Dashboard</a>
        </p>
      </div>
    </div>
  </body>
</html>
